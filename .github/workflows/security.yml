name: Security Check

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 6 1 * *"

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Composer Audit
        run: composer audit --locked
