name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  tests:
    name: Tests & Quality (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Prepare Environment
        run: |
          mkdir -p var
          cp .env.example .env

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit Tests
        run: composer test

      - name: Run PHPStan Static Analysis
        run: composer phpstan

      - name: Run Rector Dry-Run
        run: composer rector

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: piece-analyzer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose Startup & Healthcheck
        run: |
          PORT=8080 docker compose up -d
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' $(docker compose ps -q app) 2>/dev/null || echo '"starting"')
            echo "Health status: $STATUS"
            if [ "$STATUS" = '"healthy"' ]; then
              echo "App is healthy!"
              break
            fi
            sleep 2
          done

          # Smoke test HTTP endpoints and static assets
          curl -f -I http://localhost:8080/
          curl -f -I http://localhost:8080/build/app.js
          curl -f -I http://localhost:8080/build/css/global.css

      - name: Cleanup
        if: always()
        run: docker compose down -v
