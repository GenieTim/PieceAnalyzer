controllers:
    resource: ../../src/Controller/
    type: attribute
    prefix: /{_locale}
    requirements:
        _locale: 'en|de|fr'
    defaults:
        _locale: 'en'
    exclude: ../../src/Controller/Api/


api_controllers:
    resource: ../../src/Controller/Api/
    type: attribute

kernel:
    resource: ../../src/Kernel.php
    type: attribute
