monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: critical
            handler: grouped
            excluded_http_codes: [404, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            channels: ["!event", "!mailer"]
        grouped:
            type: group
            members: [nested, deduplicated]
        nested:
            type: stream
            path: php://stderr
            level: debug
        deduplicated:
            type: deduplication
            handler: email
            time: 60
        email:
            type: symfony_mailer
            from_email: '%env(ERROR_EMAIL_FROM)%'
            to_email: '%env(ADMIN_EMAIL)%'
            subject: '[Piece Analyzer Error] %%message%%'
            level: debug
            formatter: monolog.formatter.html
            content_type: text/html
        console:
            type: console
            process_psr_3_messages: true
            channels: ["!event", "!doctrine"]
        scheduled_tasks:
            type: rotating_file
            path: "%kernel.logs_dir%/scheduled_tasks.log"
            level: info
            max_files: 7
            channels: ["console"]

