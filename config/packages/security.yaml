security:
    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: index
            logout:
                path: app_logout
                target: index
            login_throttling:
                max_attempts: 5

    access_control:
        - { path: '^/api', roles: PUBLIC_ACCESS }
        - { path: '^/([a-z]{2}/)?(login|register|verify-email|resend-verification)', roles: PUBLIC_ACCESS }
        - { path: '^/([a-z]{2}/)?(files|range|price/brickpicker|admin)', roles: ROLE_ADMIN }
        - { path: '^/([a-z]{2}/)?(bookmarklet|profile)', roles: ROLE_USER }
