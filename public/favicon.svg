<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Face Gradient (Royal Cobalt Blue) -->
    <linearGradient id="opt1_top" x1="102" y1="168" x2="410" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Outer Left Face (Facing southwest) -->
    <linearGradient id="opt1_outer_left" x1="102" y1="256" x2="102" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Outer Right Face (Facing southeast, shadow) -->
    <linearGradient id="opt1_outer_right" x1="410" y1="256" x2="410" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>

    <!-- Inner Corner Left Wall (Facing southeast, shadow) -->
    <linearGradient id="opt1_inner_right" x1="256" y1="256" x2="333" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>

    <!-- Inner Corner Right Wall (Facing southwest, medium light) -->
    <linearGradient id="opt1_inner_left" x1="179" y1="256" x2="256" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Stud Blue Gradients -->
    <linearGradient id="opt1_stud_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387ef5"/>
      <stop offset="100%" stop-color="#1b358c"/>
    </linearGradient>

    <!-- Orange / Gold Brick Gradients -->
    <linearGradient id="opt1_gold_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="opt1_gold_left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="opt1_gold_right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Volumetric Projection Beam -->
    <linearGradient id="opt1_beam_left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="opt1_beam_right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <g id="Layer_1">
    <!-- BLUE BASE 2x2 CORNER (L-shaped brick) -->
    <!-- Top Face (L-shaped: 3 quadrants) -->
    <!-- Vertices: Top (256, 168), Right (410, 256), Inner Corner (333, 300), Center Corner (256, 256), Inner Corner (179, 300), Left (102, 256) -->
    <path fill="url(#opt1_top)" d="M 256 168 L 410 256 L 333 300 L 256 256 L 179 300 L 102 256 Z"/>

    <!-- Outer Left Facet (Height 88px) -->
    <path fill="url(#opt1_outer_left)" d="M 102 256 L 179 300 L 179 388 L 102 344 Z"/>

    <!-- Outer Right Facet (Height 88px) -->
    <path fill="url(#opt1_outer_right)" d="M 333 300 L 410 256 L 410 344 L 333 388 Z"/>

    <!-- Inner Cutout Left Wall (faces southwest: light) -->
    <!-- from (179, 300) to (256, 256) dropping down 88px to (256, 344) and (179, 388) -->
    <path fill="url(#opt1_inner_left)" d="M 179 300 L 256 256 L 256 344 L 179 388 Z"/>

    <!-- Inner Cutout Right Wall (faces southeast: shadow) -->
    <!-- from (256, 256) to (333, 300) dropping down 88px to (333, 388) and (256, 344) -->
    <path fill="url(#opt1_inner_right)" d="M 256 256 L 333 300 L 333 388 L 256 344 Z"/>

    <!-- 3 BLUE STUDS ON TOP: Left, Right, and Back! -->
    <!-- STUD 1: Left Stud (Center 179.6, 231.6) -->
    <g id="Left-Stud">
      <path fill="#1c48c5" stroke="#173da8" stroke-width="1" d="M 145.6 231.6 L 213.6 231.6 L 213.6 252.5 L 145.6 252.5 Z"/>
      <ellipse cx="179.6" cy="252.3" rx="34" ry="15" fill="#1c48c5" stroke="#173da8" stroke-width="1"/>
      <ellipse cx="179.6" cy="231.6" rx="34" ry="18" fill="url(#opt1_stud_blue)"/>
    </g>

    <!-- STUD 2: Right Stud (Center 333.0, 231.6) -->
    <g id="Right-Stud">
      <path fill="#1c48c5" stroke="#173da8" stroke-width="1" d="M 299.0 231.6 L 367.0 231.6 L 367.0 252.5 L 299.0 252.5 Z"/>
      <ellipse cx="333.0" cy="252.3" rx="34" ry="15" fill="#1c48c5" stroke="#173da8" stroke-width="1"/>
      <ellipse cx="333.0" cy="231.6" rx="34" ry="18" fill="url(#opt1_stud_blue)"/>
    </g>

    <!-- STUD 3: Back Stud (Center 256.0, 187.6) -->
    <g id="Back-Stud">
      <path fill="#17399a" stroke="#132c7a" stroke-width="1" d="M 222.0 187.6 L 290.0 187.6 L 290.0 208.5 L 222.0 208.5 Z"/>
      <ellipse cx="256.0" cy="208.3" rx="34" ry="15" fill="#17399a" stroke="#132c7a" stroke-width="1"/>
      <ellipse cx="256.0" cy="187.6" rx="34" ry="18" fill="url(#opt1_stud_blue)"/>
    </g>

    <!-- VOLUMETRIC BEAM (Rising from ground plane of cutout up to floating brick) -->
    <!-- Floor of cutout is at: Left (179, 388), Center (256, 344), Right (333, 388), Front (256, 432) -->
    <!-- Base of floating brick is at: Left (179, 218), Center (256, 174), Right (333, 218), Front (256, 262) -->
    <!-- (Floating brick elevated by 170px) -->
    <polygon points="179,388 256,432 256,262 179,218" fill="url(#opt1_beam_left)"/>
    <polygon points="256,432 333,388 333,218 256,262" fill="url(#opt1_beam_right)"/>

    <!-- FLOATING GOLDEN 1x1 BRICK -->
    <!-- Elevated: Top diamond center at (256, 130), height = 88px (same as base units!) -->
    <!-- Top Face: (256, 86) to (333, 130) to (256, 174) to (179, 130) -->
    <g id="Floating-Piece">
      <!-- Top Diamond Face -->
      <path fill="url(#opt1_gold_top)" d="M 256 86 L 333 130 L 256 174 L 179 130 Z"/>
      <!-- Left Face (height 88px) -->
      <path fill="url(#opt1_gold_left)" d="M 179 130 L 256 174 L 256 262 L 179 218 Z"/>
      <!-- Right Face (height 88px) -->
      <path fill="url(#opt1_gold_right)" d="M 256 174 L 333 130 L 333 218 L 256 262 Z"/>

      <!-- Golden Stud on top (centered at 256, 130) -->
      <!-- Base ellipse at Y=130, Top ellipse at Y=109 (height 21px) -->
      <path fill="#d97706" stroke="#b45309" stroke-width="1" d="M 222 109 L 290 109 L 290 130 L 222 130 Z"/>
      <ellipse cx="256" cy="130" rx="34" ry="15" fill="#d97706" stroke="#b45309" stroke-width="1"/>
      <ellipse cx="256" cy="109" rx="34" ry="18" fill="url(#opt1_gold_top)"/>
    </g>
  </g>
</svg>